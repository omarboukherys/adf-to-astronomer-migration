version: 2

models:
  - name: stg_orders
    description: One row per order version received, typed, with a validity flag.
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: updated_at
        data_tests: [not_null]
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [not_null]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [not_null]
