# Intégration continue : à chaque push et pull request, les tests tournent dans la même
# image Astro Runtime que les DAGs (Airflow 3 + Cosmos + dbt dans son venv).
# Aucun secret à créer : les tests analysent les DAGs et le projet dbt sans appeler Snowflake.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (astro dev pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      # Le script d'installation interroge l'API GitHub : sans jeton, la limite de requêtes
      # anonymes des runners partagés est vite atteinte. Le jeton automatique du workflow suffit
      # (passé explicitement à sudo, qui ne transmet pas les variables d'environnement).
      - name: Installer l'Astro CLI (même version qu'en local)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -sSL install.astronomer.io | sudo GITHUB_TOKEN="$GITHUB_TOKEN" bash -s -- v1.47.0

      - name: Vérifier la version de l'Astro CLI
        run: astro version

      - name: Créer un .env vide (le vrai, avec la connexion Snowflake, n'est pas versionné)
        run: touch .env

      - name: Lancer les tests (DAGs, rendu Cosmos du projet dbt, générateur)
        run: astro dev pytest tests
